[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "attendance-cli"
version = "1.0.0"
description = "人力资源考勤数据管理命令行工具"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "python-dateutil>=2.8.0",
    "tabulate>=0.9.0",
]

[project.scripts]
attendance = "attendance.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["attendance*"]
